; ╔══════════════════════════════════════════════════════════════════════════╗
; ║           📅 电子课表系统 —— schedule_config.ini（主配置文件）              ║
; ╚══════════════════════════════════════════════════════════════════════════╝
;
; 📌 本文件说明
; ═══════════════════════════════════════════════════════════════════════════
; 本文件为 Schedule4.0 的核心配置文件，所有参数均位于 [Schedule] 节下。
; 程序启动时由 schedule_config.py 中的 ThemeManager 读取。
; 若本文件不存在或参数缺失，程序将使用下方注释中标注的默认值。
;
; ⚠️  修改本文件后需重启程序才能生效。
; ⚠️  参数名区分大小写，请勿随意修改。
; ⚠️  路径分隔符请统一使用正斜杠 "/"（Windows 兼容）。

[Schedule]

; ================================================================
;  theme — UI 主题（字符串）
; ================================================================
;  可选值：
;    lightcolor  — 浅色模式（白底深字，全部窗口）
;    darkcolor   — 深色模式（深灰底浅字，全部窗口）
;    multicolor  — 彩色模式（课表主窗口与置顶时间窗口使用主题色，其余窗口保持浅色）
;  默认值：lightcolor
;  影响范围：见上；theme_color 仅在 multicolor 下生效
theme = darkcolor

; ================================================================
;  theme_color — 彩色模式的主题色（字符串，十六进制 #RRGGBB）
; ================================================================
;  仅当 theme = multicolor（彩色模式）时生效。
;  取值：#RRGGBB 十六进制颜色字符串（可带或不带 # 前缀，不区分大小写）。
;  默认值：#2196F3
theme_color = #6c4aff

; ================================================================
;  language — 显示语言（字符串）
; ================================================================
;  可选值：
;    Chinese — 中文
;    English — 英文
;  默认值：Chinese
;  影响范围：界面文字、提示信息等
language = Chinese

; ================================================================
;  timetable — 时间表 JSON 文件路径（字符串，相对路径）
; ================================================================
;  指向 Config/timetable/ 目录下的时间表配置文件。
;  时间表定义了每一节课的开始和结束时间，以及分隔线的位置。
;  文件格式示例：
;    {
;      "lesson_1": ["8:00:00", "8:40:00"],
;      "lesson_2": ["8:50:00", "9:30:00"],
;      "dividerline_1": "-",
;      ...
;    }
;  默认值：Config/timetable/timetable_1.json
timetable = Config/timetable/timetable_1.json

; ================================================================
;  table — 课程表 JSON 文件路径（字符串，相对路径）
; ================================================================
;  指向 Config/curriculum/ 目录下的课程表配置文件。
;  课程表定义了每周每天每节课对应的科目名称。
;  文件格式示例：
;    {
;      "Monday":    { "lesson_1": "数学", "lesson_2": "英语", ... },
;      "Tuesday":   { "lesson_1": "信息", "lesson_2": "语文", ... },
;      ...
;    }
;  默认值：Config/curriculum/table_1.json
table = Config/curriculum/table_1.json

; ================================================================
;  fullscreen_bg_folder — 全屏时间创意模式背景图片文件夹（字符串，相对路径）
; ================================================================
;  指向 images/FullScreenBackgrounds/ 下的子文件夹。
;  程序会随机使用该文件夹内的图片作为全屏时间窗口的背景。
;  默认值：images/FullScreenBackgrounds/default
fullscreen_bg_folder = images/FullScreenBackgrounds/default

; ================================================================
;  log_retention_days — 日志保留天数（整数）
; ================================================================
;  程序启动时会自动清理超过此天数的旧日志文件。
;  可选值：0 ~ 365（设为 0 表示不保留任何历史日志，每次启动清空）
;  默认值：7
log_retention_days = 7

; ================================================================
;  translation_site — 默认翻译网站 id（字符串）
; ================================================================
;  取值：Config/TranslationTest/translation_sites.txt 中列出的网站 id。
;  后端程序每 2.5 小时对各候选网站做一次测试翻译（结果保存在
;  Config/TranslationTest/outcome.json），并把可用度最高的网站 id
;  自动写入本键；用户未输入科目英文名时，默认使用该网站进行翻译。
;  默认值：google
translation_site = mymemory

; ================================================================
;  subject_font — 主窗口科目显示字体（字符串）
; ================================================================
;  主窗口课时（科目）标签使用的字体家族名。
;  取值范围：系统中已安装的任意字体家族名（如 Arial、Microsoft YaHei、SimSun 等）。
;  修改后需重启程序才会生效（设置页选择新字体后点击「应用修改」重启）。
;  默认值：Arial
subject_font = Arial

; ================================================================
;  LG — 关于页作者署名开关（布尔值）
; ================================================================
;  控制「关于」页面第二行显示的作者署名。
;  可选值：
;    true  — 显示「高2026届 赵晨羽」
;    false — 显示「温谨」
;  默认值：false
LG = true

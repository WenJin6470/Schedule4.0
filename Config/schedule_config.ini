; ╔══════════════════════════════════════════════════════════════════════════╗
; ║               📅 电子课表系统 —— 主设置配置文件                           ║
; ║                  Schedule_info/schedule_config.ini                       ║
; ╚══════════════════════════════════════════════════════════════════════════╝
;
; 📌 说明
; ═══════════════════════════════════════════════════════════════════════════
; 本文件是电子课表项目的核心配置文件，所有可调节参数集中管理在此。
; 前端程序 (schedule_frontend.py) 和后端程序 (schedule_backend.py)
; 均从此文件读取配置，确保参数统一。
;
; 格式说明：
;   - 使用标准 INI 格式：[节名] 下定义 键 = 值
;   - 以分号 ; 开头的行为注释
;   - 修改后重新运行程序即可生效，无需重新编译

; ============================================================================
;  [Schedule] — 课表核心参数
; ============================================================================
[Schedule]

; period_count：每日课时数量（整数）
;   说明：决定课表主窗口中显示的课时标签控件数量
;   取值范围：1 ~ 15
;   默认值：7
period_count = 7

; theme：软件主题（字符串）
;   说明：决定窗口背景色和字体颜色
;   取值：
;     lightcolor    — 浅色模式（白底黑字）
;     darkcolor     — 深色模式（黑底白字）
;     multicolor — 彩色自适应（根据桌面背景取色）
;   默认值：lightcolor
theme = darkcolor

; language：显示科目的语言（字符串）
;   说明：决定课表科目名称的显示语言
;   取值：
;     Chinese — 中文显示
;     English — 英文显示
;   默认值：Chinese
;   注意：当前版本暂不做语言切换处理，仅存储参数供后续使用
language = Chinese

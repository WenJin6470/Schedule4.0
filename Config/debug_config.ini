; ║               📅 电子课表系统 —— 调试配置文件                               ║
; ║                  Config/debug_config.ini                                   ║
; ╚══════════════════════════════════════════════════════════════════════════╝
;
; 📌 说明
; ═══════════════════════════════════════════════════════════════════════════
; 本文件用于调试时覆盖系统时间，方便测试不同日期/时间的课表显示效果。
;
; 规则：
;   - enabled = true  时启用调试模式
;   - enabled = false 时所有调试参数无效，使用系统真实时间
;   - 启用后，各参数若留空（值为空字符串），则该项目回退到系统真实值
;   - 各参数独立回退：例如只填了 time 而 year/month/day 留空，
;     则日期使用真实日期，仅时间使用调试时间
;
; 格式说明：
;   - 使用标准 INI 格式：[节名] 下定义 键 = 值
;   - 以分号 ; 开头的行为注释
;   - 修改后需重启程序生效

; ============================================================================
;  [Debug] — 调试参数
; ============================================================================
[Debug]

; enabled：是否启用调试模式（布尔值 true / false）
;   说明：设为 true 后，下方的时间参数才会生效
;   默认值：false
enabled = false

; year：模拟年份（整数，留空则使用真实年份）
;   取值范围：2024 ~ 2099
;   默认值：（空 — 使用系统年份）
year =

; month：模拟月份（整数，留空则使用真实月份）
;   取值范围：1 ~ 12
;   默认值：（空 — 使用系统月份）
month =

; day：模拟日期（整数，留空则使用真实日期）
;   取值范围：1 ~ 31
;   默认值：（空 — 使用系统日期）
day =

; time：模拟时间（字符串，格式 HH:MM:SS，留空则使用真实时间）
;   格式示例：08:30:00、14:15:00、23:59:59
;   默认值：（空 — 使用系统时间）
time =

; weekday：模拟星期（字符串，留空则使用真实星期或由 year/month/day 推算）
;   取值：Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday
;   说明：设置后优先级最高，直接指定课表显示的星期，
;         不会受 year/month/day 参数影响
;   默认值：（空 — 由日期推算或使用系统星期）
weekday =
